version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: internflow-db
    environment:
      POSTGRES_DB: internflow_prod
      POSTGRES_USER: internflow_user
      POSTGRES_PASSWORD: production_secret_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internflow_user -d internflow_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internflow-backend
    environment:
      DATABASE_URL: postgresql://internflow_user:production_secret_change_me@postgres:5432/internflow_prod
      INTERNFLOW_JWT_SECRET: production_jwt_secret_key_change_me
      INTERNFLOW_GEMINI_API_KEY: ${INTERNFLOW_GEMINI_API_KEY}
      INTERNFLOW_GEMINI_MODEL: gemini-2.0-flash
      CORS_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:5173,https://internflow.com"
      INTERNFLOW_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: internflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
